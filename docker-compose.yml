services:
  postgres:
    image: postgres:15-alpine
    container_name: novologic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: novologic_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d novologic_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
